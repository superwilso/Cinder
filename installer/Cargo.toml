[package]
name = "cinder-installer"
version = "0.4.1"
edition = "2021"
description = "Install, update or remove Cinder on a Sony NW-A50-series Walkman"
license = "PolyForm-Noncommercial-1.0.0"

# Deliberately DEPENDENCY-FREE. This is the one artefact end users run, it ships as a single .exe
# from a GitHub release, and it cross-compiles from Linux to x86_64-pc-windows-gnu with nothing
# but mingw. Every crate added here is a crate someone has to trust to plug a player in.
[dependencies]

# Except on macOS, which has no SCSI passthrough for a mounted disk: the upgrade command goes out
# as raw USB mass storage there (stage.rs, bot.rs). Vendored libusb, so nothing to install.
[target.'cfg(target_os = "macos")'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }

[[bin]]
name = "cinder-installer"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
