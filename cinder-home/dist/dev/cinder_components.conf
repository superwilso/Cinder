# cinder_components.conf — generated by tools/configure.sh; do not edit by hand.
# Sourced by install_cinderhome.sh on the device. Values are whitelist-validated.
# channel: dev

# Power off / Restart menu  (allowed: 0 1)
CINDER_POWER=1

# USB mass storage (put music on the device)  (allowed: 0 1)
CINDER_MSC=1

# Set the clock and RTC  (allowed: 0 1)
CINDER_CLOCK=1

# Unmount helper for USB mass storage  (allowed: 0 1)
CINDER_UMOUNT=1

# GPU present path (experimental, dev only)  (allowed: 0 1)
CINDER_GPUNODE=0

# Audio sound signature  (allowed: stock pv1 pv2 clock hw1 hw2)
CINDER_SIGNATURE=stock
