# components.conf — the catalogue of OPTIONAL parts of a Cinder install.
#
# This is the single source of truth for both tools/configure.sh (the picker the user runs on the
# host) and install_cinderhome.sh (which runs on the device and gates each step on the answers).
# Adding a component means adding ONE line here; neither side hardcodes a component list.
#
# FORMAT — a header line of five pipe-separated fields, no pipes inside them:
#   id | VARNAME | type | default | title
#
#   id       short kebab-case name, used on the command line (configure.sh --enable <id>)
#   VARNAME  the variable written into cinder_components.conf and read by the installer
#   type     bool                  -> 0 or 1
#            enum:a,b,c            -> exactly one of the listed values
#   default  the value used when the user does not choose (must be valid for the type)
#   title    one-line label shown in the picker
#
# followed by indented lines, which are what the person installing reads:
#   text                 the description; lines join up, and a blank line starts a new paragraph
#   - text               a bullet, on its own line
#   = value | label | what it does
#                        enum only, one per value, and every value needs one. The label is what
#                        the drop-down shows; the text is shown with the description, after its
#                        first paragraph
#   # text               a note for developers. NEVER SHOWN to the person installing
#
# WRITE THE DESCRIPTION FOR THE PERSON INSTALLING, NOT FOR THE NEXT DEVELOPER. Until 2026-10-05
# these were RE notes — register paths, ALSA device names, setuid, SHA-256s — and the owner's verdict
# on them was "terrible" and "overly complicated". Say what the option does for them, what they
# lose without it, and anything they must do themselves, in short sentences. The how and the why
# go in the `#` notes under each entry, and the full story in install.md and analysis/.
#
# WHAT DOES NOT BELONG HERE: anything the device cannot survive without. The cinder-home binary,
# the launcher and the .appcfg swap are the install; they are never optional. Every component
# below is something a reasonable person might not want, usually because it trades attack surface
# or battery for a feature.
#
# FOUR ENTRIES WERE REMOVED ON 2026-09-12, and the rule above is why. `power`, `msc`, `clock` and
# `umount` were offered as choices, and each one's own description said what turning it off cost:
# "without it there is no way to power the device off from the UI", "this is how files get onto the
# player", "without it the clock cannot be set at all", and a helper that only existed to serve
# `msc`. A picker that offers to remove the power button is not offering a choice, it is offering
# a defect — and the four helpers together are 60 KB. They are now part of every install, exactly
# like cinder-home itself.
#
# The device side needs no change for that: install_cinderhome.sh reads each answer with
# `comp_bool CINDER_POWER 1`, i.e. absent means on, and the installer stages a file whose owning
# component is not in this catalogue (build.rs FILES). An old cinder_components.conf on a player
# that says CINDER_MSC=0 is simply no longer consulted for it.

fm | CINDER_FM | bool | 1 | FM radio: signal meter and fast scan
    Gives the radio a signal-strength meter and a station scan that takes about a second.

    Without it the radio still plays, but there is no signal meter and a scan takes about a minute.
    It adds one small helper with system access, and that helper can only reach the radio chip.
    # Installs cinder-fm, setuid-root, whose whole job is to chmod 0666 two kernel files:
    # /proc/regmon/Si4708icx/{target,value}. Sony's own driver publishes the FM chip's registers
    # there, and reaching them is what gives the radio a REAL signal meter, a band scan that takes
    # a second instead of ninety, and the chip's own hardware seek. Sony's service cannot do any of
    # the three: GetSignalLevel returns a constant 1 and StartAutoTuning is a stub.
    # The exposure is narrow: those two files reach one FM receiver at one I2C address and nothing
    # else on the bus — not the charger, not NFC, and not /dev/i2c-2 itself. Without it, scan falls
    # back to measuring the audio and the screen honestly draws no meter at all.

battery | CINDER_BATTERY | bool | 1 | Charger details on the battery screen
    Adds the charger's own readings to the battery screen: whether it is charging, any charging
    fault, the charge current and the voltage the battery is charged to.

    Without it the battery screen still shows the charge level, health, voltage and temperatures.
    It adds one small helper with system access, and that helper can read the charger but never
    change it.
    # A setuid-root reader for the bq24262 charger's registers, root-only under
    # /proc/regmon/bq24262/ and the only place this device reports charge state, fault code, input
    # and charge current settings, and the regulation voltage. sysfs offers only capacity, status,
    # health and voltage_now: there is no fuel gauge on this platform and no current sense, and
    # mt-auxadc publishes calibration constants rather than live readings.
    # NOTE the difference from `fm`: this helper does NOT make the kernel nodes world-writable. It
    # reads them and prints. Writing the bq24262 reprograms a lithium battery charger — regulation
    # voltage, current limit, safety timer — so nothing in Cinder is ever given the ability to.

search | CINDER_SEARCH | bool | 0 | Library search (new)
    Adds a search button to the Library. Type part of a song, artist or album name and tap a result
    to play it.

    Off by default while it is new.
    # Nothing is installed and it needs no privileges: the installer leaves one flag file,
    # /data/cinder/search_on, which the player reads at startup. "Add tracks" on a playlist page
    # keeps its own search either way.

sensme | CINDER_SENSME | bool | 0 | SensMe channels (new)
    Adds SensMe to the menu: play your library by mood, like radio stations (Active, Relax, Night,
    Morning and more).

    Your music has to be analysed on a PC first, by Flint (Cinder's PC companion) or by Sony's
    Music Center. Until then the SensMe screen only explains how, which is why this is off by
    default.
    # The analysis is a tag inside each music file; Sony's own scanner on the player turns it into
    # the channels, and Cinder reads what the scanner wrote, so it cannot tell the two tools apart.
    # Music Center's tag has been reported to add nearly a megabyte to each file; Flint
    # (github.com/superwilso/flint) writes about 6 KB, and only into the copy on the player.
    # Nothing is installed: one flag file, /data/cinder/sensme_on, read at startup.

scrobble | CINDER_SCROBBLE | bool | 1 | Scrobble log (for Last.fm)
    Keeps a list of the songs you finish, in .scrobbler.log on the player's drive, for Flint or
    another Last.fm uploader to send.

    If you use the scrobbler that comes with Wampy, leave this on: Cinder notices it and stays
    out of the way, so nothing is logged twice. Turning this off keeps any log you already have.
    # Nothing is installed: turning it off leaves one flag, /data/cinder/scrobble_off, read at
    # startup. unknown321/scrobbler writes the same file, and Cinder checks for it at every start:
    # while it is running Cinder writes nothing. Remove theirs later and Cinder simply takes over.

voltable | CINDER_VOLTABLE | enum:stock,wm1a,w1,region | stock | Headphone volume curve
    How much each step of the volume control changes the loudness at the headphone jack.
    = stock  | Sony standard           | Your player's own curve. Steps 40 to 60 and 100 to 120 change nothing.
    = wm1a   | Smooth (NW-WM1A)        | Every step changes the volume, in smaller steps near the top. Needs a file (below).
    = w1     | Walkman One             | Measured the same as Sony standard. Needs a file (below).
    = region | Sony, with region limit | Keeps the quieter limit Sony sets in some regions, such as the EU and Korea.

    Turn the volume down before the first start: on a player sold with Sony's volume limit, every
    choice except "Sony, with region limit" is louder than before at the same number.

    For Smooth, copy ov_127x.tbl (and ov_dsd_127x.tbl, for DSD) next to the MUSIC folder on the
    player's drive before installing; for Walkman One, ov_1280.tbl. With Wampy installed there is
    nothing to copy. Without the file, Sony standard is kept. Where to get the files: install.md,
    "The volume curve tables".
    # MEASURED on this unit (analysis/RE_volume_pop.md): the stock A50 curve (ov_1291) wastes 40 of
    # the 120 steps — PHV sits at 100 across vol 40-60 and pins at 228 above 100 — and its live steps
    # coarsen toward the top, where the volume-change pop is loudest. ov_127x (NW-WM1A) is monotonic
    # over the whole range with finer steps at the top. Both reach the same maximum; WM1A is
    # quieter at low numbers (vol 20: 44 vs 80) and above 90, louder around 60-80, so a familiar
    # setting sounds different. `w1` (ov_1280) measured behaviourally identical to stock
    # and is offered only so that can be re-checked without a reinstall.
    # BRING THE TABLE: neither ov_127x.tbl nor ov_1280.tbl is part of the NW-A50 firmware, and they
    # are Sony's files, so Cinder cannot ship them. A file is taken only if its SHA-256 is Sony's;
    # Wampy's own copies on the player are found and used.
    # `stock` is the A50 curve WITHOUT Sony's regional restriction. Regions Wampy measured as
    # restricted (CEW2, KR3) boot a quieter table, which Cinder replaces on every boot unless the
    # answer is `region`, which keeps the table the player's boot script chose.
    # Settings > Volume limit is separate and still works: it is Sony's safe-listening cap.

signature | CINDER_SIGNATURE | enum:stock,pv1,pv2,clock,hw1,hw2 | stock | Sound signature (Walkman One modes)
    Recreates Walkman One's "Plus" sound modes from your own player's files, so you can compare
    them by ear. Measured at the headphone jack, none of them changed the sound.
    = stock | Sony standard           | No change.
    = pv1   | Walkman One Plus v1     | As Walkman One ships it. Uses more battery while music plays.
    = pv2   | Walkman One Plus v2     | As Walkman One ships it. Uses more battery while music plays.
    = clock | Faster processor only   | Just the faster processor from the Plus modes. Uses more battery while music plays.
    = hw1   | Plus v1 audio path only | Just the audio-path change from Plus v1. No battery cost.
    = hw2   | Plus v2 audio path only | Just the audio-path change from Plus v2. No battery cost.

    Your player's original file is kept, so you can go back to Sony standard at any time with Update.
    # Patches three bytes of the stock audio HAL (libaudiohal-adleralsa.so): which ALSA PCM device
    # the output stream opens and what CPU clock floor is held during playback — Walkman One's plus
    # modes, reproduced exactly. Its external tunings are another model's firmware and are not
    # reproducible; see analysis/RE_walkmanone_extract.md. Measured at the jack, neither changes
    # the signal (Wampy's MAKING_OF_VOLUME_TABLES.md; analysis/RE_headphone_amp_modes.md).
    # The original is backed up and every variant is rebuilt from it, so switching never stacks.
    #   stock  hw:0,0 + hw:0,4, floor 1.04 GHz   (Sony original — no change)
    #   pv1    both paths hw:0,0, floor 1.3 GHz  (Walkman One variant)
    #   pv2    both paths hw:0,4, floor 1.3 GHz  (Walkman One variant)
    #   clock  floor 1.3 GHz only, signal path untouched
    #   hw1    both paths hw:0,0, floor left alone
    #   hw2    both paths hw:0,4, floor left alone
    # The 1.3 GHz floor is the battery cost. clock/hw1/hw2 are combinations Walkman One does not
    # ship — they split its two effects apart so each can be judged on its own.

w1tuning | CINDER_W1_TUNING | bool | 0 | Walkman One external tuning (Walkman One players only)
    Walkman One ignores its own Plus mode, gain, DAC and colour settings until its "external
    tuning" has been applied. This applies the tuning that matches the sound signature in your
    Walkman One settings file, from the copy Walkman One keeps on the player, so you do not need
    its Windows tool. On Sony's own firmware it does nothing.

    It replaces a block of your player's factory data with one taken from another player. Your own
    is saved first, on the player's drive, as cinder_nvram_backup.img: copy that file somewhere
    safe. Afterwards the player may show a different Bluetooth address and need pairing again.

    Measured at the headphone jack, the tuning itself does not change the sound. It is off by
    default, and it has not yet been run on a player.
    # What the "tuning" is (analysis/RE_walkmanone_installers.md): a whole MTK NVRAM partition
    # image for mmcblk0p3 and another model's bootloader for p7. W1's boot script only compares
    # md5(p3) with a constant, so only p3 is written here — never the bootloader.
    # The image is unpacked from W1's own package to a FILE with the updater's fwpup, its md5 is
    # checked against the value W1's boot script expects, and only then is it written and read
    # back; a mismatch after the write puts the saved copy back. The player's own fwpup outside the
    # updater answers "Invalid signature" (2026-10-05), so a live install leaves this undone.
    # Undo by hand: write cinder_nvram_backup.img (or W1's own /opt2/stock/nv_bk) back to p3.

mono | CINDER_MONO | bool | 1 | Mono and soundscapes over music (with Wampy)
    Lets the Mono switch work on the headphone jack and Bluetooth, and lets soundscapes play over
    your music. This needs Wampy; on a player without it, use the next option instead.

    The Mono switch still starts off, and nothing changes until you turn it on. Without this
    option, mono only works for USB-DAC to Bluetooth, and a soundscape pauses while music plays.

    If anything goes wrong it switches itself off after two bad starts. Reinstalling or updating
    Wampy removes it; install Cinder again afterwards to get it back.
    # Installs libcinder_mono.so INTO Sony's sound service: it takes the place of Wampy's
    # libsound_service_fw.so (the one library Sony's boot already preloads there), keeps Wampy's
    # file byte for byte as libsound_service_fw.wampy.so and loads it straight back, so Wampy
    # keeps working. Without Wampy there is no such preload and nothing is installed.
    # While MONO is on, left and right are summed and halved (never clipped) after all of Sony's
    # sound effects; DSD and anything that is not plain stereo passes through untouched.
    # SAFETY: a crash in that service switches the player off, so the library counts its own loads
    # and, after two boots in a row where neither Cinder started nor any audio played, loads as if
    # it were not there. /data/cinder/mono_shim_off turns its processing off without a reinstall.
    # Turning this off, or uninstalling Cinder, puts Wampy's library back.

preload | CINDER_PRELOAD | bool | 0 | Mono and soundscapes over music (without Wampy, new)
    The same as the option above, for a player without Wampy. With Wampy installed, leave this off.

    To do it, Cinder puts a small program in front of Sony's audio services and adds a few lines to
    Sony's start-up script. That reaches deeper into the system than any other option, so it is
    off by default. It only installs on stock firmware 1.02 or Walkman One 3.02.

    After installing, play any song for a few seconds. Until you do, a start that does not reach
    Cinder (including starting with the USB cable plugged in) puts Sony's setup back by itself. If
    the player ever hangs while starting, hold the power button to restart it.

    To turn it off without reinstalling, put an empty file named cinder_preload_off at the top of
    the player's drive.
    # A small program takes the place of Sony's `hagodaemon` (kept beside it as hagodaemon.real),
    # starts every Sony service exactly as before, and adds the library for the sound service
    # alone. THAT PROGRAM STANDS IN FRONT OF EVERY SONY SERVICE, which is why this is opt-in.
    # It is installed with:
    #   * a guard that runs at every boot before any service starts. Until the player has played
    #     five seconds of music through the new arrangement it is on trial: a boot that does not
    #     reach Cinder, or one where playback was started and never ran, and the next boot puts
    #     Sony's program back by itself.
    #   * six lines added to Sony's boot script (/system/bin/bootswitcher.sh) to call that guard,
    #     only if the script is byte for byte the one Cinder knows (the same file on stock 1.02
    #     and Walkman One 3.02); on any other, nothing at all is installed.
    # /data/cinder/preload_off does the same as the drive-root file.
    # Turning this off, or uninstalling Cinder, puts Sony's program and boot script back. A firmware
    # update replaces both; install Cinder again afterwards.
