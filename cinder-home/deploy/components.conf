# components.conf — the catalogue of OPTIONAL parts of a Cinder install.
#
# This is the single source of truth for both tools/configure.sh (the picker the user runs on the
# host) and install_cinderhome.sh (which runs on the device and gates each step on the answers).
# Adding a component means adding ONE line here; neither side hardcodes a component list.
#
# FORMAT — five pipe-separated fields, no pipes inside them:
#   id | VARNAME | type | default | title
# followed by one or more indented description lines (leading whitespace = continuation).
#
#   id       short kebab-case name, used on the command line (configure.sh --enable <id>)
#   VARNAME  the variable written into cinder_components.conf and read by the installer
#   type     bool                  -> 0 or 1
#            enum:a,b,c            -> exactly one of the listed values
#   default  the value used when the user does not choose (must be valid for the type)
#   title    one-line label shown in the picker
#
# WHAT DOES NOT BELONG HERE: anything the device cannot survive without. The cinder-home binary,
# the launcher and the .appcfg swap are the install; they are never optional. Every component
# below is something a reasonable person might not want, usually because it trades attack surface
# or battery for a feature.

power | CINDER_POWER | bool | 1 | Power off / Restart menu
    Installs cinder-power, a small setuid-root helper that calls reboot(2). Sony's own
    PowerMgrServiceClient cannot do this while Cinder is the Home app — its shutdown barrier waits
    on an ACK from every service that Cinder never sends, so Reboot() freezes the device. Grants
    two fixed verbs and takes no caller-supplied paths. Without it there is no way to power the
    device off from the UI.

msc | CINDER_MSC | bool | 1 | USB mass storage (put music on the device)
    Installs cinder-msc, setuid-root. Both privileged steps are root-only on this device: the LUN
    backing-file write opens the block device with the caller's credentials, and sys.sony.config is
    refused for uid system. This is how files get onto the player, so turning it off is only
    sensible if you transfer over the SD card instead.

clock | CINDER_CLOCK | bool | 1 | Set the clock and RTC
    Installs cinder-clock, setuid-root. settimeofday(2) and RTC_SET_TIME both need CAP_SYS_TIME and
    cinder-home runs as uid 100 with an empty capability set. NOTHING in vendor/sony/lib exposes a
    clock setter, so the kernel is the only route. Without it the clock cannot be set at all.

umount | CINDER_UMOUNT | bool | 1 | Unmount helper for USB mass storage
    Installs cinder-umount, setuid-root. Needed by the USB-MSC handoff to release /contents.
    Pointless without the msc component; harmless but dead weight if msc is off.

gpunode | CINDER_GPUNODE | bool | 0 | GPU present path (experimental, dev only)
    Installs cinder-gpunode, setuid-root, whose whole job is to chmod 0666 four kernel graphics
    nodes (/dev/ion, /dev/mtkfb_vsync, /dev/mtk_disp, /dev/sw_sync) so uid-100 EGL can open them.
    That is real attack surface in exchange for a present path that is DEFAULT OFF and measured
    4.7x SLOWER than the software one (45.6 ms/present vs 9.6 — FBIOPUT_VSCREENINFO contends with
    the Mali pipeline). Off unless you are actively doing GPU experiments.

fm | CINDER_FM | bool | 1 | FM signal meter, fast scan and hardware seek
    Installs cinder-fm, setuid-root, whose whole job is to chmod 0666 two kernel files:
    /proc/regmon/Si4708icx/{target,value}. Sony's own driver publishes the FM chip's registers
    there, and reaching them is what gives the radio a REAL signal meter, a band scan that takes a
    second instead of ninety, and the chip's own hardware seek. Sony's service cannot do any of the
    three: GetSignalLevel returns a constant 1 and StartAutoTuning is a stub.
    The exposure is narrower than gpunode's: those two files reach one FM receiver at one I2C
    address and nothing else on the bus — not the charger, not NFC, and not /dev/i2c-2 itself.
    Without it the radio still works; scan falls back to measuring the audio (about a minute) and
    the screen honestly draws no meter at all.

battery | CINDER_BATTERY | bool | 1 | Battery / charger detail

    A setuid-root reader for the bq24262 charger's registers, which are root-only under
    /proc/regmon/bq24262/ and are the only place this device reports its charge state, fault code,
    input and charge current settings, and the voltage it actually charges the cell to.
    Everything sysfs offers is capacity, status, health and voltage_now: there is no fuel gauge on
    this platform and no current sense, and mt-auxadc publishes calibration constants rather than
    live readings. Without this the battery screen still shows those four facts plus the board
    temperatures, and simply omits the charger detail.
    NOTE the difference from `fm`: this helper does NOT make the kernel nodes world-writable. It
    reads them and prints. Writing the bq24262 reprograms a lithium battery charger — regulation
    voltage, current limit, safety timer — so nothing in Cinder is ever given the ability to.

voltable | CINDER_VOLTABLE | enum:stock,wm1a,w1 | stock | Wired volume curve

    Which output volume table the codec loads. MEASURED on this unit (analysis/RE_volume_pop.md):
    the stock A50 curve wastes 40 of the 120 steps — vol 40-60 and vol 100-120 both do nothing at
    all — and its live steps coarsen toward the top, which is where the volume-change pop is
    loudest. `wm1a` is the NW-WM1A's own table, already present on every stock device: monotonic
    across the whole range, no dead zones, finer steps at the top.
    It does NOT raise the maximum (both curves reach the same ceiling) but it IS quieter at the
    same number through the mid range, so a familiar volume setting will sound different.
    `w1` is Walkman One's table, offered only because it can then be re-checked without a
    reinstall — it measured behaviourally identical to stock.

signature | CINDER_SIGNATURE | enum:stock,pv1,pv2,clock,hw1,hw2 | stock | Audio "sound signature"
    Patches three bytes of the stock audio HAL (libaudiohal-adleralsa.so) to choose which ALSA PCM
    device the output stream opens and what CPU clock floor is held during playback. This is the
    whole of what Walkman One's paid sound signature does; see analysis/RE_walkmanone_extract.md.
    The original is backed up and every variant is rebuilt from it, so switching never stacks.
      stock  hw:0,0 + hw:0,4, floor 1.04 GHz   (Sony original — no change)
      pv1    both paths hw:0,0, floor 1.3 GHz  (Walkman One variant)
      pv2    both paths hw:0,4, floor 1.3 GHz  (Walkman One variant)
      clock  floor 1.3 GHz only, signal path untouched
      hw1    both paths hw:0,0, floor left alone
      hw2    both paths hw:0,4, floor left alone
    The 1.3 GHz floor costs battery whenever audio plays. clock/hw1/hw2 are combinations Walkman
    One does not ship — they split its two effects apart so each can be judged on its own.
