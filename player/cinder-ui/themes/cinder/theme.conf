# Cinder's own theme, every value written out. A theme folder holds a theme.conf like this one;
# any key left out falls back to the value here. Values after # are the other choices.
name         = Cinder
format       = 2
type.title   = 22 / 700
type.row     = 19 / 600
shape.radius = 0          # 0 to 24
shape.cover  = 0          # 0 to 24
density      = big        # compact | big | huge
row          = rule       # rule | card | plain | mono
row.sel      = wash       # wash | bar | caret | ring
chip         = outline    # outline | fill | underline | bracket
switch       = square     # square | pill | check
play         = disc       # disc | ring | square | text
