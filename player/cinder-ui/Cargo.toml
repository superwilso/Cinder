[package]
name = "cinder-ui"
version = "0.1.0"
edition = "2021"

[features]
# `dev` = the development channel (built from the SAME tree as stable, just with this flag).
# It only changes a visible on-device marker so you can tell the two builds apart; the adb dev
# access is a separate devtools .UPG, not baked into the binary.
dev = []

[dependencies]
embedded-graphics = "0.8"
fontdue = "0.9"
