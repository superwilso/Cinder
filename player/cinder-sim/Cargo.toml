[package]
name = "cinder-sim"
version = "0.1.0"
edition = "2021"
# One binary, `device`: drives the real on-device nav::App from the keyboard or a --script.
default-run = "device"

# Interactive desktop preview of the real cinder-ui code, in a 480x800 window
# (displays on Windows via WSLg). Host-only.

[dependencies]
cinder-ui = { path = "../cinder-ui" }
minifb = "0.28"
