[package]
name = "cinder-sim"
version = "0.1.0"
edition = "2021"
# `device`: drives the real on-device nav::App from the keyboard or a --script.
# `player`: the virtual player — the real FFI on a map of a real player (tools/map_player.sh).
default-run = "device"

# Interactive desktop preview of the real cinder-ui code, in a 480x800 window
# (displays on Windows via WSLg). Host-only.

[dependencies]
cinder-ui = { path = "../cinder-ui" }
cinder-ffi = { path = "../cinder-ffi" }
minifb = "0.29"
