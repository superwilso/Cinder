name: release

# Builds the end-user installer and attaches it to a GitHub release.
#
# Only the INSTALLER is built here. The device binaries it embeds (cinder-home, cinder-probe, the
# setuid helpers, the .UPG) are committed under cinder-home/dist/ because building them needs a
# glibc-2.23 + libc++-3.9.0 cross toolchain matched to the player's own runtime — see
# cinder-home/build.sh. Reproducing that on a hosted runner would be a lot of machinery to
# maintain for no gain, so the ARM side is built by a maintainer and committed.
#
# That means: BUILD AND COMMIT dist/ BEFORE TAGGING, or the release ships whatever was last
# committed. The installer's build.rs fails loudly if a payload file is missing, so a stale or
# incomplete dist/ breaks the build here rather than shipping a broken .exe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel to embed"
        required: false
        default: stable
        type: choice
        options: [stable, dev]

permissions:
  contents: write

env:
  CINDER_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cinder-installer.exe
            asset: cinder-installer-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cinder-installer
            asset: cinder-installer-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Payload sanity
        shell: bash
        run: |
          # The tagged commit carries the ARM binaries; if one is missing the installer builds an
          # incomplete package or fails obscurely inside build.rs. Fail here, by name.
          missing=0
          for f in cinder-home/dist/stable/cinder-home \
                   cinder-home/dist/stable/cinder-probe \
                   cinder-home/dist/stable/cinder_home_install.upg \
                   cinder-home/dist/stable/cinder_components.conf; do
            [ -f "$f" ] || { echo "::error::missing payload $f"; missing=1; }
          done
          [ "$missing" = 0 ]

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        working-directory: installer
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        working-directory: installer
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        working-directory: installer
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "${{ matrix.asset }}"
          ls -l "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: installer/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List what is being published, with checksums
        run: |
          ls -lR dist
          # A published binary nobody can verify is a binary nobody should run. The sums go in the
          # release body so a download can be checked without trusting the download itself.
          ( cd dist && sha256sum * | tee SHA256SUMS )

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # NOT a draft. It was, and that was the bug: the workflow ran, built both installers,
          # attached them — and left the release invisible until someone opened GitHub and pressed
          # Publish. "Automated" has to mean the artefacts are actually reachable at the end.
          # A tag with a suffix (v1.2.3-rc1) still ships, but marked pre-release.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installing

            Download **cinder-installer-windows-x64.exe**, plug the Walkman in over USB in
            mass-storage mode, and run it. It finds the player, asks which optional parts you
            want, and copies them across.

            It does **not** flash anything — the player does that itself from
            Settings ▸ Device Settings ▸ Update, after you eject it.

            **Read [RECOVERY.md](../blob/main/RECOVERY.md) first.** This device has no public
            DFU/EDL recovery path.

            ### Verifying the download

            `SHA256SUMS` is attached. On Windows:

            ```powershell
            Get-FileHash .\cinder-installer-windows-x64.exe -Algorithm SHA256
            ```

            The installer is unsigned, so SmartScreen will warn about an unknown publisher — that
            is expected for an unsigned binary and is not itself evidence of anything. Check the
            hash against `SHA256SUMS` if you want more than my word for it.
