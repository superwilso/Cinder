name: release

# Builds the end-user installer and cinder-rescue (rescue/, eMMC backup and restore over MediaTek's
# download mode) and attaches both to a GitHub release.
#
# Only the INSTALLER is built here. The device binaries it embeds (cinder-home, the
# setuid helpers, the .UPG) need a glibc-2.23 + libc++-3.9.0 cross toolchain matched to the
# player's own runtime — see cinder-home/build.sh — so tools/release.sh builds them on a
# maintainer's machine. They are NOT committed: only their checksums are (PAYLOAD.sha256). The
# files go up to the draft release payload-<tag> before the tag is pushed, every job here fetches
# them with tools/fetch_payload.sh, which refuses anything the manifest does not describe, and the
# release job attaches the same cinder-payload.tar.gz to the published release, where ci.yml and
# fresh clones fetch it until the next release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel to embed"
        required: false
        default: stable
        type: choice
        options: [stable, dev]

permissions:
  contents: write

env:
  CINDER_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # ── the payload must be the one tools/release.sh VERIFIED ────────────────────────────────
      #
      # This used to be an existence check, and that was the hole (docs/SHORTCOMINGS.md item 4 /
      # D4: the integrity guard is "real, correct, and opt-in"). tools/release.sh rebuilds the
      # stable channel from source and refuses to tag unless every committed byte matches — but
      # `git tag && git push --tags` reaches this workflow directly without it, and a stale dist/
      # then ships as an installer full of last week's binaries, green tick and all.
      #
      # The runner cannot repeat that comparison — it needs the glibc-2.23 cross toolchain, which
      # is the whole reason dist/ is built by a maintainer rather than here. So release.sh leaves a
      # manifest of what it verified and this checks the fetched payload matches it AND that it was
      # written for THIS tag; a tag cut without the script finds one naming the previous version.
      #
      # Via a SCRIPT, deliberately: the same rule the shellcheck gate is under. A check a
      # contributor cannot run locally is one that fails for the first time during a release.
      # The tag argument is passed ONLY on a tag push. On a manual workflow_dispatch GITHUB_REF_NAME
      # is a BRANCH name, which can never equal the tag the manifest records — so this step failed
      # every dispatch run, and the dispatch path exists precisely to build a test .exe without
      # cutting a release. With no argument the script still verifies every payload hash; it only
      # skips the "verified for THIS tag" assertion, which is meaningless off a tag.
      #
      # The payload is not committed (see the top of this file). On a tag it comes from the draft
      # release.sh uploaded, checked against the manifest AND the tag; a manual run fetches the last
      # release's, so its installer is that release's payload around this commit's installer code.
      - name: Fetch the payload the manifest describes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_payload.sh ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: installer
        run: cargo test

      - name: Build
        working-directory: installer
        run: cargo build --release

      - name: Stage artifact
        working-directory: installer
        run: |
          Copy-Item target/release/cinder-installer.exe cinder-installer-windows-x64.exe
          Get-ChildItem cinder-installer-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: cinder-installer-windows-x64.exe
          path: installer/cinder-installer-windows-x64.exe
          if-no-files-found: error

      - name: cinder-rescue — test, build, stage
        working-directory: rescue
        run: |
          cargo test --release
          cargo build --release
          Copy-Item target/release/cinder-rescue.exe cinder-rescue-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: cinder-rescue-windows-x64.exe
          path: rescue/cinder-rescue-windows-x64.exe
          if-no-files-found: error

  # The Linux build sends the same vendor SCSI command the Windows build does (SG_IO rather than
  # SCSI pass-through), so both finish the install; it needs root, and says so when it does not
  # have it (installer/src/console.rs, print_trigger_failed).
  #
  # It shipped in v0.1.2 and then quietly stopped: the v0.1.3 rework moved to the Sony-updater
  # handoff and dropped this job, while the README went on promising a Linux build for six weeks.
  # It is back rather than the promise being withdrawn, because ci.yml has been building AND
  # testing it on every push the whole time — the only things ever missing were publishing it and
  # an honest exit code.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The payload, checked against the manifest (see the Windows job).
      - name: Fetch the payload the manifest describes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_payload.sh ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: installer
        run: cargo test --release
      - name: Build
        working-directory: installer
        run: cargo build --release
      - name: Stage artifact
        working-directory: installer
        run: |
          cp target/release/cinder-installer cinder-installer-linux-x64
          ls -l cinder-installer-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: cinder-installer-linux-x64
          path: installer/cinder-installer-linux-x64
          if-no-files-found: error
      - name: cinder-rescue — test, build, stage
        working-directory: rescue
        run: |
          cargo test --release
          cargo build --release
          cp target/release/cinder-rescue cinder-rescue-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: cinder-rescue-linux-x64
          path: rescue/cinder-rescue-linux-x64
          if-no-files-found: error

  # macOS: EXPERIMENTAL until a real Mac has installed and uninstalled with it (docs/ROADMAP.md,
  # "Testers with a Mac"). One universal binary, Apple silicon and Intel, unsigned.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The payload, checked against the manifest (see the Windows job).
      - name: Fetch the payload the manifest describes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_payload.sh ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test
        working-directory: installer
        run: cargo test --release
      - name: Build both and join them
        working-directory: installer
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output cinder-installer-macos \
            target/aarch64-apple-darwin/release/cinder-installer \
            target/x86_64-apple-darwin/release/cinder-installer
          lipo -info cinder-installer-macos
      # The Mac binary links libusb statically (LGPL-2.1, through rusb's vendored build), so its
      # licence ships beside it; the release notes say where its source is and how to relink.
      - name: Attach libusb's licence
        working-directory: installer
        run: |
          cp "$(find ~/.cargo/registry/src -path '*/libusb1-sys-*/libusb/COPYING' | head -1)" \
            LICENSE-libusb.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cinder-installer-macos
          path: |
            installer/cinder-installer-macos
            installer/LICENSE-libusb.txt
          if-no-files-found: error
      # cinder-rescue links the same vendored libusb, so LICENSE-libusb.txt above covers it too.
      - name: cinder-rescue — test, build both, join them
        working-directory: rescue
        run: |
          cargo test --release
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output cinder-rescue-macos \
            target/aarch64-apple-darwin/release/cinder-rescue \
            target/x86_64-apple-darwin/release/cinder-rescue
          lipo -info cinder-rescue-macos
      - uses: actions/upload-artifact@v7
        with:
          name: cinder-rescue-macos
          path: rescue/cinder-rescue-macos
          if-no-files-found: error

  release:
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Job-level permissions REPLACE the workflow's, so contents: write is restated. id-token lets
    # the job ask GitHub's OIDC issuer for the short-lived identity Sigstore signs with;
    # attestations lets it store the result against this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      # The payload the installers embed: needed below for the .UPGs, and attached to the release
      # as cinder-payload.tar.gz, which is where ci.yml and fresh clones fetch it from.
      - name: Fetch the payload, and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/fetch_payload.sh "$GITHUB_REF_NAME"
          gh release download "payload-$GITHUB_REF_NAME" -p cinder-payload.tar.gz -D dist

      # Beside the programs, ONE more download: the .UPG packages (already inside every installer;
      # these are for flashing by hand) and libusb's licence, so the release page lists the
      # programs and little else.
      - name: Pack cinder-extras.zip
        run: |
          mkdir extras
          for k in install uninstall; do
            cp cinder-home/dist/stable/cinder_home_$k.upg extras/cinder-home-$k.upg
            cp cinder-home/dist/stable/cinder_home_$k.nw-wm1a.upg extras/cinder-home-$k.nw-wm1a.upg
          done
          mv dist/LICENSE-libusb.txt extras/
          cp .github/extras-readme.txt extras/README.txt
          ( cd extras && zip -X -9 ../dist/cinder-extras.zip * )
          unzip -l dist/cinder-extras.zip

      - name: List what is being published, with checksums
        run: |
          ls -lR dist
          # A published binary nobody can verify is a binary nobody should run.
          ( cd dist && sha256sum -- * | tee SHA256SUMS )

      # BUILD PROVENANCE (docs/SHORTCOMINGS.md D7). SHA256SUMS proves a download matches what this
      # job published; it cannot prove this workflow, from this commit, produced it — anyone able to
      # replace a file could replace the sums beside it. An attestation is signed through Sigstore
      # with the run's own OIDC identity (repository, workflow file, commit), so it can be checked
      # with `gh attestation verify <file> -R superwilso/Cinder` and cannot be minted outside a run.
      #
      # One step over SHA256SUMS rather than one per build job: every published file, the extras
      # zip included, is covered by the same list attached as SHA256SUMS. It says nothing about
      # where the committed ARM payload came from — that is D4's manifest, checked above.
      - name: Attest build provenance for every published file
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      # The body: this version's own page when it has one (v0.4.0-rc2 uses v0.4.0's), its images
      # pinned to this tag's tree, then the install and verify text every release shares.
      - name: Write the release notes
        run: |
          page=".github/release-notes/${GITHUB_REF_NAME%%-*}.md"
          {
              if [ -f "$page" ]; then
                  sed "s|{{TAG}}|$GITHUB_REF_NAME|g" "$page"
              else
                  printf '%s\n\n%s\n%s\n' '## What changed' \
                      'See [CHANGELOG.md](../blob/main/CHANGELOG.md) for the curated entry for this version, including which' \
                      'items were verified on hardware and which are still device-gated. The generated commit list follows below.'
              fi
              echo
              cat .github/release-notes.md
          } > release-body.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # NOT a draft. It was, and that was the bug: the workflow ran, built the installer,
          # attached them — and left the release invisible until someone opened GitHub and pressed
          # Publish. "Automated" has to mean the artefacts are actually reachable at the end.
          # A tag with a suffix (v1.2.3-rc1) still ships, but marked pre-release.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: release-body.md

      # The payload's draft has done its job: every installer above embeds it, and the release
      # itself now carries cinder-payload.tar.gz.
      - name: Remove the payload draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "payload-${GITHUB_REF_NAME}" -y || echo "no payload draft to remove"
