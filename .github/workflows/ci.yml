name: ci

# Builds, tests and lints everything that CAN be checked on a hosted runner.
#
# WHY THIS EXISTS SEPARATELY FROM release.yml. The release workflow only runs on a tag, so until
# now the first time the installer was compiled for Windows was during the release itself — which
# is the worst possible moment to discover it does not compile. This runs the same build on every
# change, so a tag is a formality rather than a gamble.
#
# The ARM LINK is still not done here: it needs a glibc-2.23 + libc++-3.9.0 cross toolchain matched
# to the player's runtime, which is real machinery to maintain on a runner for little gain. The
# device binaries are built by a maintainer: `tools/release.sh` verifies them byte-for-byte
# against a fresh build, commits only their checksums (cinder-home/dist/PAYLOAD.sha256), and the
# files ride on the release as cinder-payload.tar.gz, which `tools/fetch_payload.sh` downloads.
#
# But "we cannot LINK for ARM here" was quietly being read as "we cannot check the C++ at all", and
# that left ~19,400 lines of C and C++ — the code that runs as root, owns the boot path and drives
# the closed Sony services — with no automated gate of any kind (docs/SHORTCOMINGS.md §A1). The
# `native` job below closes most of that with a stock toolchain and about a minute of runner time.
#
# ── TRIGGERS: ONE RUN PER CHANGE, NOT TWO ───────────────────────────────────────────────────────
# This used to be `push: ["**"]` PLUS `pull_request`, and for a branch with a PR open — which is
# every branch that matters — BOTH fired, so every push ran the whole matrix TWICE. Eight jobs
# where four were wanted, for the life of the repo.
#
# Now `pull_request` covers branches and `push` covers main. A branch with no PR gets no CI; that
# is the deliberate trade, and `workflow_dispatch` is the escape hatch when you want a run anyway.

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]     # tags are release.yml's job, no need to run twice
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly published advisory against unchanged code is found by the calendar rather
    # than by the next unrelated commit. Monday 07:00 UTC.
    - cron: "0 7 * * 1"


# A second push supersedes the first, so cancel the run it replaced rather than paying for both to
# finish. Never on main: a green tick there is a record of what shipped, not a preview.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: ${{ matrix.what }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - what: player (host tests)
            os: ubuntu-latest
            dir: player
          - what: installer (linux)
            os: ubuntu-latest
            dir: installer
          - what: installer (windows)
            os: windows-latest
            dir: installer
          # Builds the macOS USB path (stage.rs, bot.rs) that nothing else compiles.
          - what: installer (macos)
            os: macos-latest
            dir: installer
          # cinder-rescue: raw USB through vendored libusb on all three, so each one is built.
          - what: rescue (linux)
            os: ubuntu-latest
            dir: rescue
          - what: rescue (windows)
            os: windows-latest
            dir: rescue
          - what: rescue (macos)
            os: macos-latest
            dir: rescue
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      # The installer embeds the device payload, which is not committed: this downloads the last
      # release's and checks it against cinder-home/dist/PAYLOAD.sha256. Public, so forks work too.
      - name: Fetch the device payload
        if: matrix.dir == 'installer'
        shell: bash
        run: bash tools/fetch_payload.sh
      - name: Check generated localization catalog
        if: matrix.dir == 'player'
        working-directory: .
        run: python tools/generate_locales.py --check
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: cargo test --release
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: cargo build --release

      # Every preview, rendered from this commit, downloadable from the run. This replaces the
      # PNGs that used to be committed: golden.txt already fails the job on a pixel change, so the
      # images are for LOOKING at a change, and a run artifact is always current where a committed
      # folder was two months stale.
      - name: Render UI previews
        if: matrix.dir == 'player'
        working-directory: player
        run: cargo run --release -p cinder-host >/dev/null
      - uses: actions/upload-artifact@v7
        if: matrix.dir == 'player'
        with:
          name: ui-previews
          path: player/out/
          retention-days: 14
          if-no-files-found: error

      # The tree was formatted once, in a commit of its own (see .git-blame-ignore-revs), so this
      # only ever fails on the lines a change touched.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ matrix.dir }}
        run: cargo fmt --all -- --check
      # Clippy: no warnings at all. The backlog was cleared on 2026-11-03; a lint that is wrong for
      # one piece of code is allowed there, with a comment saying why, not switched off here.
      # macOS keeps the bug-only groups: its USB code cannot be linted off a Mac, so nobody has run
      # the full set on it yet. Widen it once a macOS run passes.
      - name: Clippy
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --all-targets -- ${{ matrix.os == 'macos-latest' && '-D clippy::correctness -D clippy::suspicious' || '-D warnings' }}

  # ── the half of the tree nothing used to check ─────────────────────────────────────────────────
  # Linux only, no cross toolchain, no matrix — about a minute. Every step here is run locally and
  # passing before being wired. (The first version of this job was NOT: the shellcheck step went
  # red on its first run because the runner's shellcheck was older than the local one. Hence the
  # pinning below, and hence "run it locally first" being written down rather than assumed.)
  native:
    name: C/C++ syntax + self-tests + shell + harness + launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ~19,400 lines of C and C++ that nothing compiled before this. It is a SYNTAX check, not a
      # build: it cannot see the ABI, the glibc ceiling, or anything needing the device's headers.
      # It answers "does this parse", which is the question nothing was asking — and on its first
      # run it found probe.cpp using uintptr_t in seven places with no <cstdint>, building only
      # because the device toolchain happened to pull it in transitively.
      - name: C/C++ syntax check
        run: tools/host_syntax_check.sh

      # The pure-logic rules that decide whether the device pauses, reconnects, reboots, notices new
      # music or believes its own battery gauge. Every *_selftest.cpp, globbed — the same script
      # build.sh and .githooks/pre-push run.
      - name: C++ self-tests
        run: bash cinder-home/tools/selftests.sh

      # 5,288 lines of shell across 33 scripts — the launcher, the crash supervisor, the bad-boot
      # counter, the USB-MSC ordering. All root-privileged, all on the boot path, and none of it
      # had so much as a syntax check.
      #
      # PINNED, AND VIA A SCRIPT, both for the same reason. The first version of this job inlined
      # the commands and used whatever shellcheck the runner image shipped — and it went red on its
      # first run, because the local shellcheck used to verify it was 0.11.0 and the runner's was
      # older, and the two disagree about `#!/system/xbin/busybox sh`. A lint gate whose version
      # floats is a gate that can turn red with no source change. tools/shell_check.sh is what a
      # contributor runs locally, so local and CI cannot drift into checking different things.
      - name: Install pinned shellcheck
        run: pipx install shellcheck-py==0.11.0.1 || pip install --user shellcheck-py==0.11.0.1

      - name: Shell syntax + lint
        run: tools/shell_check.sh

      # The release payload must be exempt from Git's EOL rewriting — and this has to be checked
      # HERE, on every push, not at release time.
      #
      # v0.1.7 is why. release.yml verifies the payload against a sha256 manifest, and that gate ran
      # for the FIRST TIME on the v0.1.7 tag (v0.1.6 was prepared but never tagged). It failed
      # immediately: `windows-latest` checks out with core.autocrlf=true, which rewrote the two text
      # members of the payload, so their hashes no longer matched. Nothing was stale — the bytes were
      # changed in transit — but the release was already cut before anything noticed.
      #
      # That is the same shape as the shellcheck lesson recorded in tools/shell_check.sh: a check
      # that only ever runs during a release is a check that fails during a release. This one is
      # cheap, deterministic, and runs on every push.
      - name: Payload is safe from line-ending rewrites
        run: tools/check_payload_attrs.sh

      # The app itself, BOOTED. Everything above checks pieces in isolation; this links the real
      # main.cpp against fake Sony services and a virtual clock, runs the easel lifecycle, and
      # asserts on the call trace — that the paired list and the notification listener are set up
      # during bring-up, that a service which is not there yet degrades a feature instead of the
      # Home app, that the idle Bluetooth poll still backs off. Those are the defects this project
      # actually ships, and nothing else in CI can see them.
      #
      # Costs about two seconds, build included: the harness replaces sleeping with advancing a
      # counter, so two virtual minutes of device time is a few milliseconds of CPU.
      # See cinder-home/harness/README.md for what it does and does not prove.
      - name: Off-device harness (boots main.cpp against fake services)
        run: cinder-home/harness/run.sh

      # The same main.cpp with the REAL UI linked in place of cinder.h's recording stubs: the shell
      # and cinder-ffi boot together. It is also the only check that every cinder.h function the
      # shell calls is really defined by cinder-ffi or a shim — the stubs answer for anything, so a
      # declaration with no definition behind it only failed on the device build. No player map
      # here (a map is someone's library), so `real-player` boots on invented values and the
      # scenarios that need a map say skip.
      - name: Off-device harness, real UI linked
        run: CINDER_HARNESS_REAL_FFI=1 cinder-home/harness/run.sh

      # The Bluetooth PCM rate monitor both the AAC library and the mono shim log from (#44).
      - name: Bluetooth PCM rate monitor
        run: cc -O2 -Wall -Wextra -o /tmp/pcm_rate_test cinder-aac/test/pcm_rate_test.c && /tmp/pcm_rate_test
      - name: cinder-aac SBC XQ Auto host test
        run: cc -O2 -Wall -Wextra -o /tmp/sbc_abr_test cinder-aac/test/sbc_abr_test.c && /tmp/sbc_abr_test

      # The escape ladder: bad-boot counter, auto-revert, crash supervisor, kill switch, the cable
      # escape. 45 cases over the launcher generated by install_cinderhome.sh — every mechanism
      # standing between a bad build and a device that needs wbrt to recover. It has existed since
      # July and nothing automatic ran it (SHORTCOMINGS.md §A3), which for the one script whose
      # failure mode is "brick" is the wrong way round. About fifteen seconds — the cases that
      # exercise the crash supervisor have to actually wait for its backoff.
      #
      # Runs here as a NON-root user, which matters: one case makes /data/cinder unwritable with
      # chmod, and chmod does not bind uid 0 — on a root shell that case silently reports a failure
      # about the tester rather than the launcher. It skips itself there and a root-proof variant
      # covers the same rule.
      - name: Launcher recovery matrix
        run: bash cinder-home/tools/test_launcher.sh

      # The hagodaemon wrapper stands in front of every Sony service on a player that has it. Built
      # natively against a stand-in "real" binary: whatever it decides, the real one must run with
      # the arguments it was given, and only SoundServiceFw may gain a preload.
      - name: hagodaemon wrapper (pass-through and preload rules)
        run: bash cinder-home/tools/test_hagowrap.sh

      # The two scripts that put that wrapper on a player and take it off again. One patches the
      # boot script init waits on; the other runs before any Sony service starts and decides
      # whether Sony's binary goes back. Neither can be tried on a player without betting a boot
      # on it, so every path runs here against a scratch root.
      - name: preload installer (nothing half installed, exact boot script only)
        run: bash cinder-home/tools/test_preload.sh
      - name: sound signature (patch, revert, Walkman One's boot copy)
        run: bash cinder-home/tools/test_signature.sh
      - name: effect chain (Clear Bass patch, revert, unknown library left alone)
        run: bash cinder-home/tools/test_chain.sh
      - name: boot guard (wrapper trial, Home app backstop)
        run: bash cinder-home/tools/test_guard.sh
      # The FM recorder's WAV writer (src/fmrec.h), shared by the AudioIn preload and cinder-home:
      # nothing written without a request, a playable header mid-recording, refusals not retried.
      - name: FM recorder (WAV writer)
        run: bash cinder-home/tools/test_fmrec.sh
      # The custom volume curve (src/vol_curve.h): interpolation, refusal of a curve that goes
      # down, and every step a whole row of Sony's table. Sony's table itself is not in CI, so the
      # trailer check runs locally (test_volcurve.sh finds the extracted firmware).
      - name: volume curve (custom table builder)
        run: bash cinder-home/tools/test_volcurve.sh

      # The /data mount + cable-pass write from the issue #14 fix: the install payload's
      # boot-critical state write, proven in a user+mount namespace (the stub mount does real
      # bind mounts, so "wrote to the ramdisk" and "wrote to the partition" are genuinely
      # different outcomes). Needs `unshare -rm`; skips cleanly where namespaces are unavailable.
      - name: Cable pass write (issue #14 fix)
        run: bash cinder-home/tools/test_cable_pass.sh

      # The install payload's mount lifecycle: a live player's /data and /system must be left as
      # they were found, the updater's must be taken away again, and the /data sentinel must never
      # outlive the run — a stray one on the partition made the NEXT updater install skip the cable
      # pass. Written 2026-09-21 and not wired in until the 2026-09-23 audit found it unrun.
      - name: Install mount lifecycle
        run: bash cinder-home/tools/test_install_mounts.sh

      # Out of Wampy's folder: Cinder's files leave /system/vendor/unknown321, Wampy's
      # stay, and the .appcfg backup can never be one that names Cinder's own launcher.
      - name: Install migration and the .appcfg backup
        run: bash cinder-home/tools/test_migrate.sh

  # ── the dependency tree, which nothing looked at ───────────────────────────────────────────────
  # ~130 crates reach the binary that runs as the device's Home app, and until now no gate checked
  # any of them against the RustSec advisory database. The installer has no dependencies on Windows
  # and Linux by design, and one on macOS (rusb, with libusb vendored, for the raw USB command there);
  # it is audited here so that stays all there is.
  #
  # `cargo audit` exits non-zero on a VULNERABILITY and zero on an unmaintained-crate warning, which
  # is the right split for this repo: a vulnerability in the tree is a stop, whereas `instant` and
  # `ttf-parser` (both transitive via fontdue) being unmaintained is a fact to know, not a reason to
  # go red. Both were clean of vulnerabilities when this job was added (2026-09-01).
  #
  # Scheduled as well as on-push: an advisory is published against code that has not changed, so a
  # gate that only runs on a commit finds out about it on the next unrelated commit.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # A plain `cargo audit` rather than a marketplace action, for the same reason the shellcheck
      # step is a script: this is the exact command a contributor runs locally, so local and CI
      # cannot drift into checking different things. Pinned, and cached — the install is the slow
      # part, not the scan.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      - name: player — advisory scan
        working-directory: player
        run: cargo audit

      - name: installer — advisory scan
        working-directory: installer
        run: cargo audit

      - name: rescue — advisory scan
        working-directory: rescue
        run: cargo audit

  # The player is 32-bit ARM, and the host runners are 64-bit: `libc` types such as statvfs's
  # f_blocks are u64 on a runner and u32 on the player. On 2026-11-03 a clippy autofix removed a
  # cast that was a no-op on the PC, and main stopped building for the player while every job here
  # stayed green. This compiles the player's Rust as the player does (no link: that needs Sony's
  # libraries, so it stays in tools/release.sh). About ten seconds from cold, plus the apt install;
  # the C compiler is for SQLite, which rusqlite builds from source.
  arm:
    name: player (32-bit ARM compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player
      - name: Install the ARM C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
      - name: Clippy for the player's target
        working-directory: player
        run: cargo clippy --target arm-unknown-linux-gnueabihf -p cinder-ffi --all-targets -- -D warnings

  payload:
    name: dist payload is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # PAYLOAD.sha256 is the list (tools/release.sh writes it from the files it verified), and the
      # fetch refuses any file that is missing or is not the byte content that was verified.
      - name: The released payload is the one release.sh verified
        run: bash tools/fetch_payload.sh

      # Architecture, glibc floor, allowed libraries, static helpers. A script, so it runs locally
      # exactly as here. It is NOT a link check: the link needs Sony's libraries, so that gate is
      # tools/release.sh (docs/SHORTCOMINGS.md A1).
      - name: The ARM binaries fit the player's runtime
        shell: bash
        # Through bash, not by path: this clone has core.filemode=false, so a new script can land in
        # git without its executable bit — which is exactly how this step first failed (rc 126).
        run: bash tools/check_arm_payload.sh
